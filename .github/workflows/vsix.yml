name: vsix

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci
      - run: npx --yes @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: scrippy-vscode
          path: vscode/*.vsix

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        with:
          files: vscode/*.vsix
          generate_release_notes: true
